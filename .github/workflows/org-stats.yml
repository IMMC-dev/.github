name: Update org stats card

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats SVG
        env:
          GH_ORG: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
          OUT_FILE: profile/org-stats.svg
        run: node scripts/generate-org-stats.mjs

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/org-stats.svg
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update org stats card"
          git push
